<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – ResumeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}" />
</head>
<body class="auth-body dark-theme">

  <div class="orb orb-blue"></div>
  <div class="orb orb-purple"></div>

  <div class="auth-wrapper">
    <div class="auth-card animate-fadeup">

      <div class="auth-logo">
        <div class="logo-icon logo-icon-lg">R</div>
        <span class="logo-text">ResumeAI</span>
      </div>

      <h1 class="auth-title">Create Your Account</h1>
      <p class="auth-sub">Start analysing resumes for free today</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.register') }}" novalidate>

        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-input" type="text" id="name" name="name"
                 placeholder="Jane Doe" required value="{{ name|default('') }}" />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@example.com" required value="{{ email|default('') }}" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" name="password"
                   placeholder="Min. 6 characters" required />
            <button type="button" class="pw-toggle" onclick="togglePassword('password')">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input class="form-input" type="password" id="confirm_password" name="confirm_password"
                 placeholder="Repeat password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>

      </form>

      <p class="auth-switch">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in →</a>
      </p>

    </div>
  </div>

  <script>
    function togglePassword(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
