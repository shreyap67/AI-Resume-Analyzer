<!-- templates/layout/navbar.html -->
<header class="topbar">

  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6"  x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>

  <div class="topbar-right">
    <span class="ai-badge pulse">🤖 AI Live</span>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <span id="themeIcon">🌙</span>
    </button>

    <button class="icon-btn" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
    </button>

    <div class="avatar-wrap">
      <div class="topbar-avatar" id="avatarBtn">
        {{ current_user.name[0].upper() }}
      </div>
      <div class="avatar-dropdown" id="avatarDropdown">
        <div class="dropdown-header">
          <strong>{{ current_user.name }}</strong>
          <small>{{ current_user.email }}</small>
        </div>
        <a href="{{ url_for('dashboard.profile') }}" class="dropdown-item">Profile Settings</a>
        {% if current_user.is_admin %}
          <a href="{{ url_for('admin.panel') }}" class="dropdown-item">Admin Panel</a>
        {% endif %}
        <div class="dropdown-divider"></div>
        <a href="#" class="dropdown-item dropdown-danger" id="logoutBtnNav">Logout</a>
      </div>
    </div>
  </div>

</header>
