<!-- templates/layout/sidebar.html -->
<aside class="sidebar" id="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">R</div>
    <span class="logo-text">ResumeAI</span>
  </div>

  <nav class="sidebar-nav">

    <div class="nav-group">
      <div class="nav-group-label">Main</div>

      <a href="{{ url_for('dashboard.home') }}"
         class="nav-item {% if request.endpoint == 'dashboard.home' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        Dashboard Home
      </a>

      <a href="{{ url_for('analysis.analyzer_page') }}"
         class="nav-item {% if request.endpoint in ['analysis.analyzer_page','analysis.result'] %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/>
        </svg>
        Resume Analyzer
      </a>

      <a href="{{ url_for('analysis.job_matcher') }}"
         class="nav-item {% if request.endpoint == 'analysis.job_matcher' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Job Matcher
      </a>

      <a href="{{ url_for('history.index') }}"
         class="nav-item {% if request.endpoint == 'history.index' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Analysis History
      </a>

      <a href="{{ url_for('resume.saved') }}"
         class="nav-item {% if request.endpoint == 'resume.saved' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        Saved Resumes
      </a>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-group">
      <div class="nav-group-label">Account</div>

      <a href="{{ url_for('dashboard.profile') }}"
         class="nav-item {% if request.endpoint == 'dashboard.profile' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Profile Settings
      </a>

      {% if current_user.is_admin %}
      <a href="{{ url_for('admin.panel') }}"
         class="nav-item {% if request.blueprint == 'admin' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Admin Panel
        <span class="nav-badge">Admin</span>
      </a>
      {% endif %}

      <!-- Logout — triggers premium modal -->
      <a href="#" class="nav-item nav-item-danger" id="logoutBtn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </a>
    </div>

  </nav>

  <!-- Sidebar footer: user info -->
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar">{{ current_user.name[0].upper() }}</div>
      <div class="user-info">
        <div class="user-name">{{ current_user.name }}</div>
        <div class="user-email">{{ current_user.email }}</div>
      </div>
    </div>
  </div>

</aside>
